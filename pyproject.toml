[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdaprod-cad-toolbox"
version = "0.1.0"
description = "Cross-application CAD and geometry operations toolbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mesh = ["trimesh>=4"]
build123d = ["build123d"]
cadquery = ["cadquery"]
dev = ["pytest>=8"]

[project.scripts]
cad = "cadtoolbox.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
