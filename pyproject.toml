[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdaprod-cad-toolbox"
version = "0.2.0"
description = "Cross-application CAD and geometry operations toolbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mesh = [
  "trimesh>=4.4",
  "numpy>=1.26",
]
build123d = [
  "build123d>=0.8",
]
cadquery = [
  "cadquery>=2.5",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
all = [
  "trimesh>=4.4",
  "numpy>=1.26",
  "build123d>=0.8",
  "cadquery>=2.5",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
cad = "cadtoolbox.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
